name: Frontend CI

on:
  push:
    branches:
      - developer
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/front.yaml"
  pull_request:
    branches:
      - developer
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/front.yaml"

jobs:
  frontend:
    name: Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build